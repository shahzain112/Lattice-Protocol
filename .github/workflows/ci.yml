name: Lattice Protocol CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov flake8 black

    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Format check with black
      run: black --check .

    - name: Run tests with pytest
      run: |
        pytest --cov=. --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Run Bandit security check
      uses: PyCQA/bandit@main
      with:
        args: "-r . -f json -o bandit-report.json || true"

    - name: Check for private keys in repo
      run: |
        if grep -r "BEGIN PRIVATE KEY" . --include="*.pem" --include="*.key"; then
          echo "❌ PRIVATE KEYS FOUND IN REPO!"
          exit 1
        fi
        if grep -r "server_private.pem" . --include="*.py" | grep -v ".gitignore"; then
          echo "⚠️  Check server_private.pem references"
        fi
        echo "✅ No private keys found in repo"

  docker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build Docker image
      run: docker build -t lattice-protocol:test .

    - name: Test Docker container
      run: |
        docker run -d -p 8080:8080 --name lattice-test lattice-protocol:test
        sleep 5
        curl -f http://localhost:8080/lattice/v1/health || exit 1
        docker stop lattice-test
